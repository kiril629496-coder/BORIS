<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>BORIS Messenger — нет соединения</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#eef5ff,#f8fbff);color:#0f172a;font-family:Inter,system-ui,-apple-system,sans-serif}.card{width:min(460px,100%);padding:30px;border:1px solid #d7e2ef;border-radius:24px;background:rgba(255,255,255,.96);box-shadow:0 24px 64px rgba(15,23,42,.09)}.logo{display:grid;place-items:center;width:54px;height:54px;border-radius:17px;background:linear-gradient(145deg,#2563eb,#1d4ed8);color:white;font-size:24px;font-weight:900;box-shadow:0 12px 26px rgba(37,99,235,.24)}h1{margin:22px 0 8px;font-size:26px;letter-spacing:-.03em}p{margin:0;color:#64748b;line-height:1.55}button{width:100%;min-height:48px;margin-top:24px;border:0;border-radius:13px;background:#1d4ed8;color:#fff;font-size:15px;font-weight:800;cursor:pointer}small{display:block;margin-top:14px;color:#94a3b8;line-height:1.4}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">B</div>
    <h1>BORIS Messenger офлайн</h1>
    <p>Сейчас нет соединения с сервером. История и отправка сообщений временно недоступны, чтобы не показывать устаревшие данные как актуальные.</p>
    <button type="button" onclick="location.reload()">Проверить соединение</button>
    <small>Когда интернет восстановится, откройте Messenger снова — данные загрузятся с сервера.</small>
  </main>
</body>
</html>
