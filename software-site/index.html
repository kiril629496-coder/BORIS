    <script>
    (function(){
        const counterId = 112462421;
        const ownerKey = 'boris_metrika_owner_optout_v1';
        if (localStorage.getItem(ownerKey) === '1') return;

        const sent = new Set();
        const currentPath = () => location.pathname + location.search;
        const sendGoal = (goal, params = {}, onceKey = null) => {
            if (onceKey && sent.has(onceKey)) return;
            if (typeof window.ym !== 'function') return;
            if (onceKey) sent.add(onceKey);
            const visitFlags = {retargeting:{audience:'software_dev'}};
            visitFlags.retargeting[goal] = true;
            window.ym(counterId, 'params', visitFlags);
            window.ym(counterId, 'reachGoal', goal, Object.assign({page: currentPath(), audience: 'software_dev'}, params));
        };

        const markRoute = () => {
            const pathname = location.pathname;
            if (!pathname.startsWith('/software-dev') && !['systems-ai-oko.ru','www.systems-ai-oko.ru'].includes(location.hostname)) return;
            const parts = pathname.replace(/^\/software-dev(?=\/|$)/, '').replace(/\/+$/, '').split('/').filter(Boolean);
            const slug = parts.length ? parts.join('/') : 'catalog';
            sendGoal('retarget_service_view', {service: slug}, 'view:' + pathname);
        };

        setTimeout(markRoute, 700);
        setTimeout(() => sendGoal('retarget_engaged_30s', {}, 'engaged30:' + location.pathname), 30000);

        let scroll50 = false;
        let scroll75 = false;
        addEventListener('scroll', () => {
            const doc = document.documentElement;
            const max = Math.max(1, doc.scrollHeight - innerHeight);
            const pct = Math.round((scrollY / max) * 100);
            if (pct >= 50 && !scroll50) {
                scroll50 = true;
                sendGoal('retarget_scroll_50', {}, 'scroll50:' + location.pathname);
            }
            if (pct >= 75 && !scroll75) {
                scroll75 = true;
                sendGoal('retarget_scroll_75', {}, 'scroll75:' + location.pathname);
            }
        }, {passive:true});

        document.addEventListener('click', (e) => {
            const a = e.target.closest('a,button');
            if (!a) return;
            const href = a.getAttribute('href') || '';
            if(a.tagName==='BUTTON' && /оцен|обсуд|рассчит|консультац/i.test(a.innerText||'')) sendGoal('software_dev_cta',{label:(a.innerText||'').slice(0,100)});
            const text = (a.innerText || a.getAttribute('aria-label') || '').trim().slice(0,120);

            if (/\/software-dev\/[a-z0-9-]+/i.test(href)) {
                sendGoal('retarget_service_interest', {target: href, label: text});
            }
            if (/wa\.me|whatsapp/i.test(href + ' ' + text)) {
                sendGoal('contact_whatsapp', {label: text});
                sendGoal('retarget_contact_intent', {channel: 'whatsapp'});
            }
            if (/max\.ru|\bMAX\b/i.test(href + ' ' + text)) {
                sendGoal('contact_max', {label: text});
                sendGoal('retarget_contact_intent', {channel: 'max'});
            }
            if (/^tel:/i.test(href)) {
                sendGoal('contact_phone', {label: text});
                sendGoal('retarget_contact_intent', {channel: 'phone'});
            }
        }, true);

        document.addEventListener('submit', (e) => {
            const form = e.target;
            sendGoal('retarget_lead_submit', {form: form.id || form.getAttribute('name') || 'form'});
        }, true);

        const push = history.pushState;
        history.pushState = function(){
            push.apply(this, arguments);
            scroll50 = false; scroll75 = false;
            if(typeof window.ym==='function') window.ym(counterId,'hit',location.href); setTimeout(markRoute, 50);
        };
        addEventListener('popstate', () => { scroll50 = false; scroll75 = false; if(typeof window.ym==='function') window.ym(counterId,'hit',location.href); setTimeout(markRoute, 50); });
    })();
    </script>
