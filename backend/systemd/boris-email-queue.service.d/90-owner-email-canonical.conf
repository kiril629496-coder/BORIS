[Service]
# OWNER_EMAIL_CANONICAL_RUNTIME_V4
# Routing values are owned by the wrapper + DB constraints. Keep this drop-in
# topology-only so systemd cannot reintroduce a stale provider configuration.
ExecStartPre=
ExecStartPre=/root/BORIS/backend/scripts/owner_email_db_guard.sh
ExecStart=
ExecStart=/root/BORIS/backend/scripts/owner_email_queue_runner.sh
