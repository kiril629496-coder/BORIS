            useEffect(() => {
                fetch('/api/public/software-site/config', { cache: 'no-store' })

                        if (Array.isArray(cfg.services) && cfg.services.length) setServicesData(cfg.services);
                        if (Array.isArray(cfg.prices) && cfg.prices.length) setPricesData(cfg.prices);
                        if (cfg.contacts && typeof cfg.contacts === 'object') {
                            setSiteSettings(prev => ({ ...prev, ...cfg.contacts }));
                        }
                    })
                    .catch(() => {});
            }, []);

            useEffect(() => {
                if (!isAdmin) return;
                fetch('/api/private/software-site/leads', { cache: 'no-store', credentials: 'same-origin' })
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('admin leads unavailable')))

                        const rows = data && Array.isArray(data.items) ? data.items : [];
                        setLeads(rows.map((x) => ({
                            ...x,
                            status: x.status || 'Новая',
                            date: x.date || (x.created_at ? String(x.created_at).replace('T', ' ').slice(0, 16) : '')

                    })
                    .catch(() => {});
            }, []);

            // Browser navigation: clean URLs; old hash URLs are converted once.
            useEffect(() => {
                if (!isAdmin && window.location.hash && window.location.hash.startsWith('#/')) {
                    const legacy = window.location.hash.replace('#', '') || '/';
                    const nextUrl = publicBase + (legacy === '/' ? '/' : legacy);
                    history.replaceState({}, '', nextUrl);
                    setCurrentPath(legacy);
                }
                const handlePop = () => {
                    setCurrentPath(pathFromLocation());
                    window.scrollTo(0, 0);
                };
                const handleLegacyHash = () => {
                    if (isAdmin || !window.location.hash.startsWith('#/')) return;
                    const legacy = window.location.hash.replace('#', '') || '/';
                    history.replaceState({}, '', publicBase + (legacy === '/' ? '/' : legacy));
                    setCurrentPath(legacy);
                    window.scrollTo(0, 0);
                };
                window.addEventListener('popstate', handlePop);
                window.addEventListener('hashchange', handleLegacyHash);
                return () => {
                    window.removeEventListener('popstate', handlePop);
                    window.removeEventListener('hashchange', handleLegacyHash);
                };
            }, []);

                const result = await onSubmitLead({ name: name || 'Гость', contact, service: 'Страница контактов', task, budget: 'Не указан' });
                if (result?.ok || result?.saved) setDone(true);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-12">
                    <div className="text-center max-w-3xl mx-auto space-y-4">
                        <h1 className="text-4xl font-extrabold text-slate-900">Контакты и обсуждение проектов</h1>
                        <p className="text-lg text-slate-600">Свяжитесь с нами любым удобным способом</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
                        <div className="lg:col-span-5 space-y-6 bg-white p-8 rounded-3xl border border-slate-200/80 shadow-sm">
                            <h2 className="text-2xl font-bold text-slate-900">Кирилл Остапенко · разработка ПО</h2>
                            <div className="space-y-4 text-sm text-slate-600">
                                <div className="flex items-start space-x-3">
                                    <span className="text-blue-600 font-bold">✉️</span>
                                    <a href={'mailto:' + (settings?.primary_email || 'eliseev-ko@mail.ru')} className="hover:text-blue-600">{settings?.primary_email || 'eliseev-ko@mail.ru'}</a>
                                </div>
                                <div className="flex items-start space-x-3">
                                    <span className="text-blue-600 font-bold">✉️</span>
                                    <a href={'mailto:' + (settings?.secondary_email || 'ostapenko-kirill-86@yandex.ru')} className="hover:text-blue-600">{settings?.secondary_email || 'ostapenko-kirill-86@yandex.ru'}</a>
                                </div>
                                {settings?.phone && (
                                    <div className="flex items-start space-x-3">
                                        <span className="text-blue-600 font-bold">☎</span>
                                        <a href={'tel:' + settings.phone.replace(/[^+0-9]/g, '')} className="hover:text-blue-600">{settings.phone}</a>
                                    </div>
                                )}
                                {settings?.telegram && (
                                    <div className="flex items-start space-x-3">
                                        <span className="text-blue-600 font-bold">✈</span>
                                        <a href={'https://t.me/' + settings.telegram.replace('@', '')} target="_blank" rel="noreferrer" className="hover:text-blue-600">{settings.telegram}</a>
                                    </div>
                                )}
                                <div className="flex items-start space-x-3">
                                    <span className="text-blue-600 font-bold">🌐</span>
                                    <span>Работаем удалённо с компаниями по России и другим регионам.</span>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-7 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-md">
                            {done ? (
                                <div className="text-center py-8 space-y-4">
                                    <div className="text-4xl">🎉</div>
                                    <h3 className="text-2xl font-bold text-slate-900">Заявка успешно принята!</h3>
                                    <p className="text-slate-600 text-sm">Мы уже получили ваше сообщение и свяжемся в течение нескольких минут.</p>
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <h2 className="text-2xl font-bold text-slate-900 mb-2">Написать по проекту</h2>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Имя</label>
                                        <input
                                            type="text"
                                            placeholder="Ваше имя"
                                            value={name}
                                            onChange={(e) => setName(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Телефон, почта или Telegram *</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="+7 / @username / mail"
                                            value={contact}
                                            onChange={(e) => setContact(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Суть задачи</label>
                                        <textarea
                                            rows="4"
                                            placeholder="Опишите, что нужно сделать или какую проблему решить..."
                                            value={task}
                                            onChange={(e) => setTask(e.target.value)}
                                            className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none"
                                        ></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition">
                                        Отправить сообщение
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ leads, setLeads, services, setServices, prices, setPrices, settings, setSettings }) {
            const [activeTab, setActiveTab] = useState('Заявки');
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState('');
            const [error, setError] = useState('');
            const [leadSearch, setLeadSearch] = useState('');
            const [leadFilter, setLeadFilter] = useState('Все');
            const [siteHealth, setSiteHealth] = useState(null);

            const request = async (url, options = {}) => {
                const r = await fetch(url, {
                    cache: 'no-store',
                    credentials: 'same-origin',
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(data?.detail || data?.message || 'Ошибка сервера');
                return data;
            };

            const handleStatusChange = async (id, newStatus) => {
                const previous = leads;
                setLeads(prev => prev.map(l => l.id === id ? { ...l, status: newStatus } : l));
                setError(''); setMessage('');
                try {
                    const data = await request('/api/private/software-site/leads/' + encodeURIComponent(id), {
                        method: 'PATCH',
                        body: JSON.stringify({ status: newStatus, note: (leads.find(l => l.id === id)?.note || '') })
                    });
                    setLeads(prev => prev.map(l => l.id === id ? { ...l, ...(data.item || {}) } : l));
                    setMessage('Статус заявки сохранён на сервере.');
                } catch (e) {
                    setLeads(previous);
                    setError('Не удалось сохранить статус: ' + e.message);
                }
            };

            const saveLeadNote = async (id) => {
                const lead = leads.find(l => l.id === id);
                if (!lead) return;
                setBusy(true); setError(''); setMessage('');
                try {
                    const data = await request('/api/private/software-site/leads/' + encodeURIComponent(id), {
                        method: 'PATCH',
                        body: JSON.stringify({ status: lead.status || 'Новая', note: lead.note || '' })
                    });
                    setLeads(prev => prev.map(l => l.id === id ? { ...l, ...(data.item || {}) } : l));
                    setMessage('Комментарий к заявке сохранён.');
                } catch (e) {
                    setError('Не удалось сохранить комментарий: ' + e.message);
                } finally {
                    setBusy(false);
                }
            };

            const refreshHealth = async () => {
                try {
                    const r = await fetch('/api/public/software-site/health', { cache: 'no-store' });
                    const data = await r.json();
                    setSiteHealth(data);
                } catch (_) {
                    setSiteHealth({ ok: false });
                }
            };

            useEffect(() => {
                refreshHealth();
            }, []);

            const saveConfig = async (payload, successText) => {
                setBusy(true); setError(''); setMessage('');
                try {
                    const data = await request('/api/private/software-site/config', {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });
                    const cfg = data.config || {};
                    if (Array.isArray(cfg.services) && cfg.services.length) setServices(cfg.services);
                    if (Array.isArray(cfg.prices) && cfg.prices.length) setPrices(cfg.prices);
                    if (cfg.contacts) setSettings(prev => ({ ...prev, ...cfg.contacts }));
                    setMessage(successText);
                } catch (e) {
                    setError('Не удалось сохранить: ' + e.message);
                } finally {
                    setBusy(false);
                }
            };

            const reloadLeads = async () => {
                setBusy(true); setError(''); setMessage('');
                try {
                    const data = await request('/api/private/software-site/leads');
                    const rows = Array.isArray(data.items) ? data.items : [];
                    setLeads(rows.map(x => ({
                        ...x,
                        status: x.status || 'Новая',
                        date: x.date || (x.created_at ? String(x.created_at).replace('T', ' ').slice(0, 16) : '')
                    })));
                    setMessage('Список заявок обновлён.');
                    refreshHealth();
                } catch (e) {
                    setError('Не удалось обновить заявки: ' + e.message);
                } finally {
                    setBusy(false);
                }
            };

            const filteredLeads = leads.filter(l => {
                const term = leadSearch.trim().toLowerCase();
                const statusOk = leadFilter === 'Все' || (l.status || 'Новая') === leadFilter;
                if (!statusOk) return false;
                if (!term) return true;
                return [l.name, l.contact, l.service, l.task, l.budget, l.status]
                    .filter(Boolean).join(' ').toLowerCase().includes(term);
            });

            const exportLeadsCsv = () => {
                const esc = (v) => '"' + String(v ?? '').replaceAll('"', '""').replace(/\r?\n/g, ' ') + '"';
                const rows = [
                    ['Дата','Имя','Контакт','Услуга','Задача','Бюджет','Статус','Комментарий'],
                    ...filteredLeads.map(l => [l.date || l.created_at || '', l.name, l.contact, l.service, l.task, l.budget, l.status || 'Новая', l.note || ''])
                ];
                const csv = '\ufeff' + rows.map(row => row.map(esc).join(';')).join('\r\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'systems-ai-zayavki-' + new Date().toISOString().slice(0, 10) + '.csv';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen bg-slate-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 space-y-7">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 pb-6 gap-4">
                            <div>
                                <span className="bg-emerald-100 text-emerald-700 font-bold text-xs px-2.5 py-1 rounded-md">Закрытая панель владельца</span>
                                <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">Заявки и управление сайтом</h1>
                                <p className="text-sm text-slate-500 mt-1">Данные хранятся на сервере, а не только в этом браузере.</p>
                            </div>
                            <a href={SITE_ASSET_BASE ? SITE_ASSET_BASE + '/' : '/'} className="inline-flex justify-center text-sm bg-white border border-slate-200 px-4 py-2.5 rounded-xl font-bold hover:border-blue-300">Открыть публичный сайт</a>
                        </div>

                        {(message || error) && (
                            <div className={'rounded-xl px-4 py-3 text-sm font-semibold ' + (error ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200')}>
                                {error || message}
                            </div>
                        )}

                        <div className="flex flex-wrap gap-2 text-xs">
                            <span className={'px-3 py-1.5 rounded-full font-bold border ' + (siteHealth?.ok ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200')}>
                                Система заявок: {siteHealth?.ok ? 'работает' : 'проверяется'}
                            </span>
                            <span className="px-3 py-1.5 rounded-full font-bold border bg-white text-slate-600 border-slate-200">
                                Почтовых получателей: {siteHealth?.recipient_count ?? 2}
                            </span>
                            <span className="px-3 py-1.5 rounded-full font-bold border bg-white text-slate-600 border-slate-200">
                                Услуг: {siteHealth?.services_count ?? services.length}
                            </span>
                            <span className="px-3 py-1.5 rounded-full font-bold border bg-white text-slate-600 border-slate-200">
                                Позиций прайса: {siteHealth?.prices_count ?? prices.length}
                            </span>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                            {[
                                ['Всего заявок', leads.length, 'text-slate-900'],
                                ['Новые', leads.filter(l => l.status === 'Новая').length, 'text-blue-600'],
                                ['В работе', leads.filter(l => ['Связались','Квалифицирована','Оценка','КП','Переговоры'].includes(l.status)).length, 'text-amber-600'],
                                ['Оплачено', leads.filter(l => l.status === 'Оплачено').length, 'text-emerald-600']
                            ].map((x, i) => (
                                <div key={i} className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
                                    <div className="text-[10px] sm:text-xs text-slate-500 font-bold uppercase">{x[0]}</div>
                                    <div className={'text-2xl sm:text-3xl font-extrabold mt-1 ' + x[2]}>{x[1]}</div>
                                </div>
                            ))}
                        </div>

                        <div className="flex border-b border-slate-200 gap-5 overflow-x-auto text-sm font-bold">
                            {['Заявки','Услуги','Цены','Контакты'].map(t => (
                                <button key={t} onClick={() => setActiveTab(t)}
                                    className={'whitespace-nowrap pb-3 px-1 border-b-2 transition ' + (activeTab === t ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500')}>
                                    {t}{t === 'Заявки' ? ' (' + leads.length + ')' : ''}
                                </button>
                            ))}
                        </div>

                        {activeTab === 'Заявки' && (
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                <div className="p-4 border-b border-slate-200 bg-slate-50/70 flex flex-col lg:flex-row gap-3 lg:items-center">
                                    <input
                                        value={leadSearch}
                                        onChange={e => setLeadSearch(e.target.value)}
                                        placeholder="Поиск по имени, контакту, услуге или задаче"
                                        className="flex-1 min-w-0 bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm"
                                    />
                                    <select value={leadFilter} onChange={e => setLeadFilter(e.target.value)}
                                        className="bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-semibold">
                                        {['Все','Новая','Связались','Квалифицирована','Оценка','КП','Переговоры','Оплачено','Проиграно'].map(x => <option key={x}>{x}</option>)}
                                    </select>
                                    <button disabled={busy} onClick={reloadLeads} className="bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-bold disabled:opacity-50">Обновить</button>
                                    <button onClick={exportLeadsCsv} className="bg-slate-900 text-white rounded-xl px-4 py-2.5 text-sm font-bold">Скачать CSV</button>
                                </div>
                                <div className="px-4 py-2 text-xs text-slate-500 border-b border-slate-100">
                                    Показано: <b>{filteredLeads.length}</b> из {leads.length}
                                </div>
                                {filteredLeads.length === 0 ? (
                                    <div className="p-8 text-center text-slate-500">Заявок по выбранному фильтру нет.</div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full min-w-[900px] text-left border-collapse text-xs">
                                            <thead><tr className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-bold">
                                                <th className="p-4">Имя / дата</th><th className="p-4">Контакт</th><th className="p-4">Услуга</th>
                                                <th className="p-4">Задача</th><th className="p-4">Бюджет</th><th className="p-4">Статус</th><th className="p-4">Комментарий</th>
                                            </tr></thead>
                                            <tbody className="divide-y divide-slate-100">
                                            {filteredLeads.map(l => (
                                                <tr key={l.id} className="hover:bg-slate-50">
                                                    <td className="p-4"><div className="font-bold text-slate-900 text-sm">{l.name}</div><div className="text-[10px] text-slate-400">{l.date}</div></td>
                                                    <td className="p-4 font-mono text-blue-600 font-bold">{l.contact}</td>
                                                    <td className="p-4 font-semibold text-slate-700">{l.service}</td>
                                                    <td className="p-4 text-slate-600 max-w-sm" title={l.task}><div className="line-clamp-3">{l.task}</div></td>
                                                    <td className="p-4 font-bold text-slate-900">{l.budget}</td>
                                                    <td className="p-4">
                                                        <select value={l.status || 'Новая'} onChange={e => handleStatusChange(l.id, e.target.value)}
                                                            className="px-2.5 py-2 rounded-lg border border-slate-200 font-bold text-xs bg-white">
                                                            {['Новая','Связались','Квалифицирована','Оценка','КП','Переговоры','Оплачено','Проиграно'].map(x => <option key={x}>{x}</option>)}
                                                        </select>
                                                    </td>
                                                    <td className="p-4 min-w-[230px]">
                                                        <textarea
                                                            value={l.note || ''}
                                                            onChange={e => setLeads(prev => prev.map(x => x.id === l.id ? { ...x, note: e.target.value } : x))}
                                                            placeholder="Что обсудили, когда перезвонить..."
                                                            className="w-full min-h-[68px] border border-slate-200 rounded-lg px-2.5 py-2 text-xs"
                                                        />
                                                        <button disabled={busy} onClick={() => saveLeadNote(l.id)}
                                                            className="mt-2 w-full bg-slate-900 text-white rounded-lg px-3 py-2 text-xs font-bold disabled:opacity-50">
                                                            Сохранить
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'Услуги' && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between gap-3 sm:items-center">
                                    <div><h2 className="text-xl font-bold">Услуги</h2><p className="text-sm text-slate-500">Меняйте название, цену и срок. После сохранения данные используются публичным сайтом.</p></div>
                                    <button disabled={busy} onClick={() => saveConfig({ services }, 'Услуги сохранены.')} className="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold disabled:opacity-50">Сохранить услуги</button>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                                {services.map((svc, idx) => (
                                    <div key={svc.id || idx} className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
                                        <input value={svc.title || ''} onChange={e => setServices(prev => prev.map((x,i)=>i===idx?{...x,title:e.target.value}:x))} className="w-full border border-slate-200 rounded-lg px-3 py-2 font-bold" />
                                        <textarea value={svc.desc || ''} onChange={e => setServices(prev => prev.map((x,i)=>i===idx?{...x,desc:e.target.value}:x))} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm min-h-[74px]" />
                                        <div className="grid grid-cols-2 gap-2">
                                            <input value={svc.price || ''} onChange={e => setServices(prev => prev.map((x,i)=>i===idx?{...x,price:e.target.value}:x))} className="border border-slate-200 rounded-lg px-3 py-2 text-sm" />
                                            <input value={svc.period || ''} onChange={e => setServices(prev => prev.map((x,i)=>i===idx?{...x,period:e.target.value}:x))} className="border border-slate-200 rounded-lg px-3 py-2 text-sm" />
                                        </div>
                                    </div>
                                ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'Цены' && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between gap-3 sm:items-center">
                                    <div><h2 className="text-xl font-bold">Прайс</h2><p className="text-sm text-slate-500">Редактируется весь прайс разработки.</p></div>
                                    <button disabled={busy} onClick={() => saveConfig({ prices }, 'Прайс сохранён.')} className="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold disabled:opacity-50">Сохранить прайс</button>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-2xl overflow-x-auto">
                                    <table className="w-full min-w-[820px] text-sm">
                                        <thead><tr className="bg-slate-50 text-left text-xs uppercase text-slate-500"><th className="p-3">Направление</th><th className="p-3">Результат</th><th className="p-3">Цена</th><th className="p-3">Срок</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100">
                                        {prices.map((item, idx) => (
                                            <tr key={idx}>
                                                <td className="p-2"><input value={item.name || ''} onChange={e=>setPrices(prev=>prev.map((x,i)=>i===idx?{...x,name:e.target.value}:x))} className="w-full border border-slate-200 rounded-lg px-2 py-2 font-semibold"/></td>
                                                <td className="p-2"><input value={item.result || ''} onChange={e=>setPrices(prev=>prev.map((x,i)=>i===idx?{...x,result:e.target.value}:x))} className="w-full border border-slate-200 rounded-lg px-2 py-2"/></td>
                                                <td className="p-2"><input value={item.price || ''} onChange={e=>setPrices(prev=>prev.map((x,i)=>i===idx?{...x,price:e.target.value}:x))} className="w-full border border-slate-200 rounded-lg px-2 py-2"/></td>
                                                <td className="p-2"><input value={item.period || ''} onChange={e=>setPrices(prev=>prev.map((x,i)=>i===idx?{...x,period:e.target.value}:x))} className="w-full border border-slate-200 rounded-lg px-2 py-2"/></td>
                                            </tr>
                                        ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'Контакты' && (
                            <div className="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 max-w-3xl space-y-4">
                                <div><h2 className="text-xl font-bold">Контакты сайта</h2><p className="text-sm text-slate-500">Обе почты для заявок уже зафиксированы на сервере. Здесь меняется отображение контактов на сайте.</p></div>
                                <label className="block text-sm font-bold">Основная почта<input value={settings.primary_email || ''} onChange={e=>setSettings(prev=>({...prev,primary_email:e.target.value}))} className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-3 font-normal"/></label>
                                <label className="block text-sm font-bold">Вторая почта<input value={settings.secondary_email || ''} onChange={e=>setSettings(prev=>({...prev,secondary_email:e.target.value}))} className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-3 font-normal"/></label>
                                <label className="block text-sm font-bold">Телефон<input value={settings.phone || ''} onChange={e=>setSettings(prev=>({...prev,phone:e.target.value}))} placeholder="+7 ..." className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-3 font-normal"/></label>
                                <label className="block text-sm font-bold">Telegram<input value={settings.telegram || ''} onChange={e=>setSettings(prev=>({...prev,telegram:e.target.value}))} placeholder="@username" className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-3 font-normal"/></label>
                                <button disabled={busy} onClick={() => saveConfig({ contacts: settings }, 'Контакты сохранены.')} className="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold disabled:opacity-50">Сохранить контакты</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

                function LeadModal({ subject, onClose, onSubmit }) {
            const [name, setName] = useState('');
            const [contact, setContact] = useState('');
            const [task, setTask] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!contact.trim()) return;
                const result = await onSubmit({
                    name: name || 'Заявка из модального окна',
                    contact,
                    service: subject,
                    task: task || 'Запрос консультации',
                    budget: 'По договоренности'
                });
                if (result?.ok || result?.saved) onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 border border-slate-200 shadow-2xl space-y-6 relative">
                        <button onClick={onClose} className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>

                        <div>
                            <span className="text-xs font-bold text-blue-600 uppercase tracking-widest">Обратная связь</span>
                            <h3 className="text-2xl font-extrabold text-slate-900 mt-1">{subject}</h3>
                            <p className="text-xs text-slate-500 mt-1">Оставьте свои контакты, и главный инженер ответит на вопросы в течение 10 минут.</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Имя</label>
                                <input
                                    type="text"
                                    placeholder="Ваше имя"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Телефон / Telegram / Email *</label>
                                <input
                                    type="text"
                                    required
                                    placeholder="+7 (999) 000-00-00 или @username"
                                    value={contact}
                                    onChange={(e) => setContact(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Краткое описание задачи</label>
                                <textarea
                                    rows="3"
                                    placeholder="Опишите ваши цели или текущие трудности..."
                                    value={task}
                                    onChange={(e) => setTask(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none"
                                ></textarea>
                            </div>

                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition">
                                Отправить запрос
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

                                    <li><a href="#/industries" onClick={(e) => { e.preventDefault(); navigate('/industries'); }} className="hover:text-white">Строительство</a></li>
                                </ul>
                            </div>

                            {/* Col 3 */}
                            <div className="space-y-3">

                    </div>

            );
        }


        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);

        if ('serviceWorker' in navigator && window.location.protocol === 'https:' && !location.pathname.startsWith('/software-dev-admin') && !location.pathname.startsWith('/admin')) {
            window.addEventListener('load', () => {
                const swBase = window.location.pathname.startsWith('/software-dev') ? '/software-dev' : '';
                navigator.serviceWorker.register(swBase + '/sw.js', { scope: swBase + '/' }).catch(() => {});
